name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.3.0"
          node-version: "26.12.1"
          cache: true
      - run: vp check
      - run: vp test --passWithNoTests
      - run: vp build
