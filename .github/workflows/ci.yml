name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-main' || github.run_id }}
  queue: max

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: "1.4.0"
          node-version: "26.12.1"
          cache: true
      - run: vp check
      - run: vp run knip
      - run: vp test
      - run: vp build
